    <rect x="160" y="108" width="54" height="38" rx="7" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="187" y="127" dominant-baseline="central" fill="#042C53">s2</text>
    <rect x="223" y="108" width="30" height="38" rx="7" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
