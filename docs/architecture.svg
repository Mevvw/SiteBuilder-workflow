    <text x="289" y="163" dominant-baseline="central" fill="#444441">DeepSeek</text>
    <rect x="365" y="154" width="52" height="18" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="391" y="163" dominant-baseline="central" fill="#444441">DeepSeek</text>
    <rect x="421" y="154" width="52" height="18" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="447" y="163" dominant-baseline="central" fill="#444441">GLM-5.3</text>
  </g>

  <path d="M491 150 V 196 H 85 V 150" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="288" y="192" font-size="11" text-anchor="middle" fill="#633806">fail/revise → 回炉 ≤2 次(违规清单注入 prompt) · g3 责任路由 s1/s2 · 超限 → abort</text>
  <text class="ts" x="58" y="224" font-size="11" fill="#444441">芯片 = --node-models 按节点覆盖模型(Budget 全局共享) · s3 工具循环取证 · s5 对抗评审 revise → 打回 s4</text>

  <rect x="40" y="252" width="600" height="118" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="58" y="276" font-size="13" fill="#085041">模型调用层(五节点共用 Runner 池 —— 多角色 · 按节点异构模型)</text>
  <g>
    <rect x="60" y="288" width="172" height="52" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="146" y="306" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#04342C">MockRunner</text>
    <text class="ts" x="146" y="324" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">纯 Python · 内置样本 + chaos</text>
    <rect x="252" y="288" width="172" height="52" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="338" y="306" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#04342C">OpenAICompatRunner</text>
    <text class="ts" x="338" y="324" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">langchain ChatOpenAI · 多厂商预设</text>
    <rect x="444" y="288" width="172" height="52" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="530" y="306" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#04342C">CloudRunner</text>
    <text class="ts" x="530" y="324" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">httpx SSE · 云端免密钥</text>
  </g>
  <text class="ts" x="58" y="358" font-size="11" fill="#085041">Budget 硬上限 200k token / 50 次调用 · 结构化输出自修复 ≤2 次 · 角色化 SYSTEM × 5(架构 / 动效 / 审计 / 策划 / 评审)</text>

  <g font-size="11">
    <rect x="40" y="388" width="10" height="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="56" y="398" fill="#444441">步骤(LLM)</text>
    <rect x="130" y="388" width="10" height="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="ts" x="146" y="398" fill="#444441">确定性门禁</text>
    <rect x="230" y="388" width="10" height="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text class="ts" x="246" y="398" fill="#444441">对抗评审 agent</text>
    <rect x="356" y="388" width="10" height="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="ts" x="372" y="398" fill="#444441">完成</text>
    <rect x="420" y="388" width="10" height="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text class="ts" x="436" y="398" fill="#444441">终止</text>
  </g>
  <text class="ts" x="40" y="424" font-size="11" fill="#888780">开源仓库:github.com/Mevvw/SiteBuilder-workflow</text>
