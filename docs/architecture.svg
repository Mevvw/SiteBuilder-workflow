<svg viewBox="0 0 680 436" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>site-workflow-chain v1.3 架构总览:LangGraph 编排层 + 模型调用层</title>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #444441; }
    .th { font-weight: 500; }
    .ts { font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="40" y="56" font-size="14" fill="#2C2C2A">site-workflow-chain · 多 Agent 建站工作流 · 架构总览</text>
  <a href="https://github.com/Mevvw/SiteBuilder-workflow" target="_blank" rel="noreferrer">
    <rect x="424" y="38" width="200" height="26" rx="13" fill="#0F6E56"/>
    <text x="524" y="52" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF">GitHub · SiteBuilder-workflow ↗</text>
  </a>

  <rect x="40" y="76" width="600" height="164" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="58" y="98" font-size="13" fill="#0C447C">LangGraph 编排层(StateGraph · 11 节点 · 门禁节点写状态 / 条件边只读)</text>

  <g font-size="11" text-anchor="middle">
