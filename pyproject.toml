[project]
name = "workflow-chain"
version = "0.1.0"
description = "网页搭建工作流链(site-workflow-chain)· LangGraph 四步建站流水线,含门禁回炉"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.7",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实云端凭证的集成测试(默认跳过,设 RUN_CLOUD_TESTS=1 启用)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
